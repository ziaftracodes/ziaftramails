name: Manual Run (On-Demand Pipeline)

on:
  workflow_dispatch:
    inputs:
      scrape_limit:
        description: 'Max leads to scrape'
        required: false
        default: '10'
      daily_limit:
        description: 'Max emails to send'
        required: false
        default: '10'
      dry_run:
        description: 'Dry run mode (no real emails)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  scrape-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 480
    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ── SCRAPER ──
      - name: 📥 Install Scraper Dependencies
        working-directory: ./scraper
        run: npm ci --omit=dev || npm install --omit=dev

      - name: 🤖 Run Scraper
        working-directory: ./scraper
        run: node index.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          SCRAPE_LIMIT: ${{ github.event.inputs.scrape_limit }}

      # ── SENDER ──
      - name: 📥 Install Sender Dependencies
        working-directory: ./sender
        run: npm ci --omit=dev || npm install --omit=dev

      - name: 🚀 Run Sender
        working-directory: ./sender
        run: node index.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          MAILJET_API_KEY: ${{ secrets.MAILJET_API_KEY }}
          MAILJET_API_SECRET: ${{ secrets.MAILJET_API_SECRET }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          DAILY_LIMIT: ${{ github.event.inputs.daily_limit }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
